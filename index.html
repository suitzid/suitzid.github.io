<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orenix</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:var(--tg-theme-bg-color,#15171d);--card:var(--tg-theme-secondary-bg-color,#1f222b);--tx:var(--tg-theme-text-color,#eef0f4);--mu:var(--tg-theme-hint-color,#8d94a5);--ac:var(--tg-theme-button-color,#e9a93b);--act:var(--tg-theme-button-text-color,#1b1405);--ln:rgba(127,127,127,.25);--ok:#2fb36d;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:16px 16px calc(88px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h3{margin:0 0 8px;font-size:18px}
p{margin:0 0 10px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.hero{font:700 25px/1.2 Unbounded,system-ui,sans-serif;margin:6px 0 18px;overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.okc{color:var(--ok)}
.gap{height:8px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--ac);color:var(--act);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);color:var(--mu)}
.chip.on{background:var(--ac);color:var(--act);font-weight:600}
.tag{display:inline-block;padding:7px 12px;margin:0 6px 6px 0;border-radius:999px;background:var(--bg);border:1px solid var(--ln)}
.line{display:block;width:100%;text-align:left;padding:10px 0;background:none;font-size:17px;font-weight:600;border-top:1px solid var(--ln)}
.line:first-of-type{border-top:0}
.line2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.line2 input[type=number]{width:96px;padding:8px 10px}
.num{display:flex;gap:8px;margin:10px 0}
.num button{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 12px;font-size:22px;font-weight:700;letter-spacing:.05em}
.num button:last-child{flex:1;overflow-wrap:anywhere}
.price{font-size:18px;font-weight:700;margin:4px 0 10px}
.plan{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 16px;margin-bottom:10px;border-radius:16px;background:var(--card);border:1px solid var(--ln);font-size:17px}
.plan:disabled{opacity:.45}
.plan .pr{font:700 17px Unbounded,system-ui,sans-serif}
.plan s{font:400 12px system-ui,sans-serif;color:var(--mu);margin-right:6px}
.pct{position:absolute;top:0;right:0;padding:3px 10px;border-radius:0 16px 0 12px;background:var(--ac);color:var(--act);font-size:12px;font-weight:700}
.inp{display:flex;align-items:center;gap:6px;margin:10px 0}
.inp span{font-size:18px;color:var(--mu)}
.st{min-height:22px;margin:0 0 10px;font-size:14px}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.note{padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--card);border:1px solid var(--ac);font-size:14px}
.note.bad{border-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:9px 0 8px;background:none;color:var(--mu);font-size:11px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n).toLocaleString('ru-RU');
let S = { me:{}, user:{}, prices:{}, tabs:[], packs:[], plans:[] }, tab = 'home', mk = 'number', asec = 'prices';
let A = null, block = null, exp = 0, tick, poll, seq = 0, tm, chUrl = '';

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST',
    headers: { 'Authorization': 'tma ' + tg.initData, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || 'Ошибка'), j);
  return j;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1800); }
function copy(t) {
  const ok = () => { toast('Скопировано'); tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); };
  const fb = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) {} a.remove(); };
  navigator.clipboard ? navigator.clipboard.writeText(t).then(ok, fb) : fb();
}
const star = k => nf(S.prices[k] ?? 0) + ' ⭐';
const openSheet = h => { $('#panel').innerHTML = h; $('#sheet').hidden = false; };
const closeSheet = () => { $('#sheet').hidden = true; };
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
const go = (t, m) => { tab = t; if (m) mk = m; render(); };
const setState = j => { S = { ...S, ...j }; exp = S.number && S.number.ttl != null ? Date.now() + S.number.ttl * 1000 : 0; };

/* ---------- каркас ---------- */
function render() {
  clearInterval(tick); clearInterval(poll);
  const items = [['home','🏠','Главная'], ['market','🛍','Маркет'], ['support','💬','Поддержка']];
  if (S.is_admin) items.push(['admin','⚙️','Управление']);
  $('#nav').innerHTML = items.map(n => `<button class="${tab === n[0] ? 'on' : ''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');
  const v = $('#view');
  if (block) { v.innerHTML = block; return; }
  let top = '';
  if (S.maint && S.maint.on) top += '<div class="note">Тех. работы включены: пользователи видят заглушку, вы — приложение.</div>';
  if (S.banned) top += '<div class="note bad">Аккаунт заблокирован: покупки недоступны.</div>';
  v.innerHTML = top + '<div id="pane"></div>';
  ({ home: pHome, market: pMarket, support: pSupport, admin: pAdmin })[tab]();
  if (!S.me.registered && S.number && (tab === 'home' || tab === 'market')) poll = setInterval(refresh, 4000);
}
async function refresh() {
  const sig = JSON.stringify([S.me, S.number]);
  try { setState(await api('/api/state')); } catch (e) { return; }
  if (JSON.stringify([S.me, S.number]) !== sig) render();
}

/* ---------- главная ---------- */
function pHome() {
  const u = S.user, m = S.me || {}, name = u.username ? '@' + u.username : (u.first_name || 'друг');
  let h = `<h1 class="hero">Добро пожаловать в Orenix, ${esc(name)}</h1>`;
  if (!m.registered) {
    h += `<div class="card"><h3>Регистрация</h3><p class="mu">${S.number ? 'Номер выдан. Введите его на сайте, затем получите код в разделе «Номер».' : 'Получите номер, чтобы зарегистрироваться в мессенджере Orenix.'}</p>
      <button class="btn" onclick="go('market','number')">${S.number ? 'Открыть мой номер' : 'Получить номер'}</button></div>`;
  } else {
    const p = m.premium || {};
    h += `<div class="card"><div class="mu">Имя в мессенджере</div><div class="big">${esc(m.name || '—')}</div></div>
      <div class="card"><div class="mu">Юзернеймы. Тап — скопировать</div><div style="margin-top:8px">${(m.usernames || []).map(x => `<button class="tag" onclick="copy('${esc(x)}')">${esc(x)}</button>`).join('') || '—'}</div></div>
      <div class="card"><div class="mu" style="margin-bottom:4px">Номера. Тап — скопировать</div>${(m.numbers || []).map(x => `<button class="line" onclick="copy('${esc(x.replace(/\s/g, ''))}')">${esc(x)}</button>`).join('') || '—'}</div>
      <div class="grid2"><div class="card"><div class="mu">Cat Coin</div><div class="big">🐾 ${nf(m.balance || 0)}</div></div>
      <div class="card"><div class="mu">Orenix Premium</div><div class="big ${p.active ? 'okc' : ''}">${p.active ? 'Активен' : 'Не активен'}</div>
      <div class="mu">${p.active ? (p.lifetime ? 'Навсегда' : 'Осталось ' + p.days_left + ' дн.') : 'Купите в маркете'}</div></div></div>`;
  }
  $('#pane').innerHTML = h;
}
function pSupport() { $('#pane').innerHTML = '<h3>Поддержка</h3><div class="card mu" style="text-align:center;padding:36px 16px">Скоро</div>'; }

/* ---------- маркет ---------- */
function pMarket() {
  const t = S.tabs || [];
  if (!t.find(x => x.k === mk)) mk = (t[0] || {}).k;
  $('#pane').innerHTML = `<div class="chips">${t.map(x => `<button class="chip ${mk === x.k ? 'on' : ''}" onclick="mk='${x.k}';render()">${x.locked ? '🔒 ' : ''}${esc(x.label)}</button>`).join('')}</div><div id="mp"></div>`;
  ({ number: mNumber, coin: mCoin, username: mUser, premium: mPrem, verify: mSoon })[mk]?.();
}
const mSoon = () => { $('#mp').innerHTML = '<div class="card mu" style="text-align:center;padding:36px 16px">Скоро</div>'; };
const needReg = () => S.me.registered ? '' : '<p class="mu">Покупки откроются после регистрации на сайте. Начните с раздела «Номер».</p>';
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function mNumber() {
  const m = S.me, n = S.number, p = $('#mp');
  if (m.registered) {
    p.innerHTML = `<div class="card"><h3>Новый номер</h3><p class="mu">Он сразу появится в профиле на сайте. Прежний останется дополнительным.</p>
      <button class="btn" onclick="openRandom()">Рандомный · ${star('number_random')}</button><div class="gap"></div>
      <button class="btn alt" onclick="openCustom()">Ввести свой · ${star('number_custom')}</button></div>`;
    return;
  }
  if (!n) {
    p.innerHTML = '<div class="card"><h3>Ваш первый номер</h3><p class="mu">Бесплатно. Нужен для регистрации на сайте.</p><button class="btn" onclick="openFirst()">Получить номер</button></div>';
    return;
  }
  const live = n.code && (exp === 0 || exp > Date.now());
  p.innerHTML = `<div class="card"><div class="mu">Ваш номер. Тап — скопировать</div>
    <div class="num"><button onclick="copy('${n.region.slice(1)}')">${esc(n.region)}</button><button onclick="copy('${n.body}')">${n.body}</button></div>
    <p class="mu" style="margin:0">На сайте введите код региона и номер без пробелов.</p></div>` +
    (live ? `<div class="card"><div class="mu">Ваш код. Тап — скопировать</div><div class="num"><button onclick="copy('${n.code}')">${n.code}</button></div>
        ${exp ? '<div class="mu">Действует ещё <b id="ttl"></b></div>' : ''}</div>`
      : `<button class="btn" ${n.entered ? '' : 'disabled'} onclick="getCode(this)">${n.expired || (n.code && !live) ? 'Получить новый код' : 'Получить код'}</button>
         ${n.entered ? '' : '<p class="mu" style="margin-top:8px">Кнопка заработает, когда вы введёте номер на сайте.</p>'}`);
  if (live && exp) {
    const t = () => { const s = Math.round((exp - Date.now()) / 1000); if (s <= 0) { render(); return; } $('#ttl').textContent = mmss(s); };
    t(); tick = setInterval(t, 1000);
  }
}
async function getCode(b) {
  b.disabled = true;
  try { const j = await api('/api/number/code', {}); S.number = j.number; exp = j.number.ttl != null ? Date.now() + j.number.ttl * 1000 : 0; render(); }
  catch (e) { toast(e.message); b.disabled = false; }
}
function openFirst() {
  openSheet(`<h3>Код региона</h3><p class="mu">Выберите код региона для номера.</p><div class="grid2">
    <button class="btn" onclick="first('+7')">+7 🇷🇺</button><button class="btn" onclick="first('+1')">+1 🇺🇸</button></div>`);
}
async function first(region) {
  try { const j = await api('/api/number/first', { region }); S.number = j.number; exp = 0; closeSheet(); render(); }
  catch (e) { toast(e.message); }
}

/* ---------- платные номера ---------- */
const rgField = () => `<div class="mu" style="margin-bottom:6px">Код региона</div><div class="inp"><span>+</span><input id="rg" inputmode="numeric" maxlength="4" placeholder="7" oninput="this.value=this.value.replace(/\\D/g,'');chkN&&chkN()"></div>
  <div style="margin-bottom:10px"><button class="tag" onclick="setRg('7')">+7</button><button class="tag" onclick="setRg('1')">+1</button></div>`;
const setRg = v => { $('#rg').value = v; chkN && chkN(); };
let chkN = null;
function openRandom() {
  chkN = null;
  openSheet(`<h3>Рандомный номер</h3><p class="mu">Вы выбираете только код региона. Цифры подбираются случайно.</p>${rgField()}
    <button class="btn" onclick="buyRandom()">Купить за ${star('number_random')}</button>`);
}
function buyRandom() { const r = $('#rg').value; if (!/^[1-9]\d{0,3}$/.test(r)) return toast('Введите код региона'); buy({ kind: 'number_random', region: r }); }
function openCustom() {
  openSheet(`<h3>Свой номер</h3>${rgField()}<div class="mu" style="margin-bottom:6px">4 цифры после кода</div>
    <input id="nb" inputmode="numeric" maxlength="4" placeholder="1234" oninput="this.value=this.value.replace(/\\D/g,'');chkN()">
    <div class="st" id="st"></div><button class="btn" id="buyb" disabled onclick="buy({kind:'number_custom',region:$('#rg').value,body:$('#nb').value})">Купить за ${star('number_custom')}</button>`);
  chkN = liveCheck(() => { const r = $('#rg').value, b = $('#nb').value; return /^[1-9]\d{0,3}$/.test(r) && b.length === 4 ? `/api/check/number?region=${r}&body=${b}` : null; });
}
function liveCheck(urlFn) {
  return () => {
    clearTimeout(tm); const st = $('#st'), b = $('#buyb'); b.disabled = true; st.textContent = ''; st.className = 'st';
    const u = urlFn(); if (!u) return;
    const my = ++seq;
    tm = setTimeout(async () => {
      try { const r = await api(u); if (my !== seq) return; st.className = 'st ' + (r.free ? 'ok' : 'bad'); st.textContent = r.message; b.disabled = !r.free || !S.me.registered || S.banned; }
      catch (e) { if (my === seq) { st.className = 'st bad'; st.textContent = e.message; } }
    }, 350);
  };
}

/* ---------- NFT-username ---------- */
function mUser() {
  $('#mp').innerHTML = `<div class="card"><h3>NFT-username</h3><p class="mu">Введите юзернейм: латиница, цифры и _, от 4 символов.</p>
    <div class="inp"><span>@</span><input id="un" maxlength="32" autocapitalize="off" autocomplete="off" placeholder="name" oninput="this.value=this.value.replace(/[^A-Za-z0-9_]/g,'');chkU()"></div>
    <div class="st" id="st"></div><button class="btn" id="buyb" disabled onclick="buy({kind:'username',name:$('#un').value})">Купить за ${star('username')}</button>${needReg()}</div>`;
  window.chkU = liveCheck(() => { const v = $('#un').value; return /^[A-Za-z0-9_]{4,32}$/.test(v) ? '/api/check/username?name=' + v : null; });
}

/* ---------- Cat Coin и Premium ---------- */
function mCoin() {
  $('#mp').innerHTML = `<div class="grid2">${S.packs.map(c => `<div class="card"><div class="big">${nf(c)} CC</div><div class="price">${star('coins_' + c)}</div>
    <button class="btn" ${S.me.registered && !S.banned ? '' : 'disabled'} onclick="buy({kind:'coins',pack:${c}})">Купить</button></div>`).join('')}</div><div class="gap"></div>${needReg()}`;
}
function mPrem() {
  const p = S.me.premium || {}, can = S.me.registered && !S.banned && !p.lifetime;
  $('#mp').innerHTML = `<p class="mu">${p.active ? (p.lifetime ? 'Premium активен навсегда' : 'Premium активен, осталось ' + p.days_left + ' дн. Новая подписка добавится к сроку.') : 'Premium не активен'}</p>` +
    S.plans.map(d => {
      const pr = S.prices['premium_' + d] || 0, base = 6.5 * d, pct = Math.round((1 - pr / base) * 100), show = d !== 7 && pct > 0;
      return `<button class="plan" ${can ? '' : 'disabled'} onclick="buy({kind:'premium',days:${d}})">${show ? `<span class="pct">−${pct}%</span>` : ''}<b>${d} дней</b>
        <span class="pr">${show ? `<s>${nf(Math.round(base))} ⭐</s>` : ''}${nf(pr)} ⭐</span></button>`;
    }).join('') + needReg();
}

/* ---------- оплата Stars ---------- */
async function buy(p) {
  if (S.banned) return toast('Аккаунт заблокирован');
  try {
    const { link } = await api('/api/buy', p);
    tg.openInvoice(link, async st => {
      if (st === 'paid') { closeSheet(); toast('Оплачено. Выдаём…'); for (let i = 0; i < 8; i++) { await new Promise(r => setTimeout(r, 1500)); await refreshHard(); } }
      else if (st === 'failed') toast('Оплата не прошла');
    });
  } catch (e) { toast(e.message); }
}
async function refreshHard() { try { setState(await api('/api/state')); render(); } catch (e) {} }

/* ---------- управление (админы) ---------- */
async function pAdmin() {
  $('#pane').innerHTML = '<p class="mu">Загрузка…</p>';
  try { A = await api('/api/admin/data'); } catch (e) { $('#pane').innerHTML = esc(e.message); return; }
  drawAdmin();
}
async function aPost(path, body) {
  try { await api(path, body); A = await api('/api/admin/data'); toast('Сохранено'); drawAdmin(); refreshHard(); }
  catch (e) { toast(e.message); }
}
function drawAdmin() {
  const secs = [['prices','Цены'], ['vis','Разделы'], ['bans','Баны'], ['adm','Админы']];
  let h = `<div class="chips">${secs.map(s => `<button class="chip ${asec === s[0] ? 'on' : ''}" onclick="asec='${s[0]}';drawAdmin()">${s[1]}</button>`).join('')}</div>`;
  if (asec === 'prices') {
    h += '<p class="mu">Цены в звёздах. Сохраняется при выходе из поля.</p>' + Object.entries(A.labels).map(([k, l]) =>
      `<div class="line2"><span>${esc(l)}</span><span><input type="number" min="1" value="${A.prices[k]}" onchange="aPost('/api/admin/price',{key:'${k}',value:this.value})"> ⭐</span></div>`).join('');
  } else if (asec === 'vis') {
    h += '<p class="mu">Скрытый раздел не видят обычные пользователи. Вы видите его с замком 🔒.</p>' + A.tabs.map(t =>
      `<label class="line2"><span>${esc(t.label)}<br><span class="mu">Скрыть от пользователей</span></span><input type="checkbox" ${A.hidden.includes(t.k) ? 'checked' : ''} onchange="aPost('/api/admin/hidden',{tab:'${t.k}',hidden:this.checked})"></label>`).join('') +
      `<div class="card" style="margin-top:14px"><h3>Технические работы</h3><label class="line2"><span>Включить</span><input type="checkbox" id="mon" ${A.maint.on ? 'checked' : ''}></label>
      <textarea id="mtx" rows="3" placeholder="Текст для пользователей" style="margin:10px 0">${esc(A.maint.text)}</textarea>
      <button class="btn" onclick="aPost('/api/admin/maint',{on:$('#mon').checked,text:$('#mtx').value})">Сохранить</button></div>`;
  } else if (asec === 'bans') {
    h += `<div class="card"><input id="bid" placeholder="Telegram ID или @username"><div class="gap"></div><div class="grid2">
      <button class="btn" onclick="aPost('/api/admin/ban',{who:$('#bid').value,banned:true})">Забанить</button>
      <button class="btn alt" onclick="aPost('/api/admin/ban',{who:$('#bid').value,banned:false})">Разбанить</button></div></div>` +
      (A.banned.length ? A.banned.map(b => `<div class="line2"><span>${b.username ? '@' + esc(b.username) : ''} <span class="mu">${b.tg_id}</span></span><button class="tag" onclick="aPost('/api/admin/ban',{who:'${b.tg_id}',banned:false})">Разбанить</button></div>`).join('') : '<p class="mu">Заблокированных нет.</p>');
  } else {
    h += `<div class="card"><input id="aid" inputmode="numeric" placeholder="Telegram ID"><div class="gap"></div>
      <button class="btn" onclick="aPost('/api/admin/admin',{id:$('#aid').value,add:true})">Назначить админом</button></div>` +
      A.admins.map(a => `<div class="line2"><span>${a.seed ? '🔒 ' : ''}${a.username ? '@' + esc(a.username) : ''} <span class="mu">${a.id || ''}</span></span>${a.seed || !a.id ? '' : `<button class="tag" onclick="aPost('/api/admin/admin',{id:'${a.id}',add:false})">Снять</button>`}</div>`).join('');
  }
  $('#pane').innerHTML = h;
}

/* ---------- запуск ---------- */
async function boot() {
  try { setState(await api('/api/state')); block = null; }
  catch (e) {
    if (e.error === 'not_subscribed') { chUrl = e.channel_url; block = `<div class="card"><h3>Подпишитесь на канал</h3><p class="mu">Без подписки приложение недоступно.</p><button class="btn" onclick="tg.openTelegramLink(chUrl)">Подписаться</button><div class="gap"></div><button class="btn alt" onclick="boot()">Я подписался</button></div>`; }
    else if (e.error === 'maintenance') block = `<div class="card"><h3>Технические работы</h3><p>${esc(e.message)}</p></div>`;
    else block = `<div class="card"><p>${esc(e.message)}</p><button class="btn" onclick="boot()">Повторить</button></div>`;
  }
  render();
}
boot();
</script>
</body>
</html>
