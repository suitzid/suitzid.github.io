<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orenix</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#15171d);
  --card:var(--tg-theme-secondary-bg-color,#1f222b);
  --tx:var(--tg-theme-text-color,#eef0f4);
  --mu:var(--tg-theme-hint-color,#8d94a5);
  --ac:var(--tg-theme-button-color,#e9a93b);
  --act:var(--tg-theme-button-text-color,#1b1405);
  --ln:rgba(127,127,127,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h2{margin:4px 0 14px;font-size:22px}
p{margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--ac);color:var(--act);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);color:var(--mu)}
.chip.on{background:var(--ac);color:var(--act);font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price{font-size:20px;font-weight:700;margin:6px 0 12px}
.soon{padding:36px 16px;text-align:center;color:var(--mu)}
.ava{width:64px;height:64px;border-radius:50%;background:var(--ac);color:var(--act);display:grid;place-items:center;font-size:28px;font-weight:700}
.num{display:flex;gap:8px;align-items:stretch;margin:10px 0}
.num button{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:26px;font-weight:700;letter-spacing:.06em}
.num button:last-child{flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-weight:600}
.seg button.on{border-color:var(--ac);color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
nav button{flex:1;padding:10px 0 9px;background:none;color:var(--mu);font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ── главная ── */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#e9a93b 0%,#d98a1f 60%,#b96f10 100%);
  color:#1b1405;border-radius:20px;padding:22px 18px;margin-bottom:14px;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.18);
}
.hero::before{
  content:"";position:absolute;right:20px;bottom:-60px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.12);
}
.hero-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero .ava{
  width:60px;height:60px;font-size:24px;background:rgba(0,0,0,.15);color:#1b1405;
  border:2px solid rgba(255,255,255,.35);
}
.hero-greet{font-size:13px;opacity:.75;font-weight:500}
.hero-name{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.hero-tag{
  display:inline-block;margin-top:12px;padding:5px 12px;border-radius:999px;
  background:rgba(0,0,0,.15);font-size:12px;font-weight:600;position:relative;z-index:1;
}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qa button{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding:16px;border-radius:16px;background:var(--card);
  font-weight:600;text-align:left;transition:transform .12s;
}
.qa button:active{transform:scale(.97)}
.qa .ico{font-size:22px}
.qa .lbl{font-size:14px}
.qa .sub{font-size:12px;color:var(--mu);font-weight:400;margin-top:-4px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:14px}
.stat .k{font-size:12px;color:var(--mu);font-weight:500}
.stat .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.stat .v.sm{font-size:14px;font-weight:600;color:var(--mu);letter-spacing:0}

.list-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 13px;margin-top:6px;border-radius:11px;background:var(--bg);
  cursor:pointer;font-size:15px;font-weight:500;
}
.list-row:active{opacity:.65}
.list-row .cp{font-size:12px;color:var(--mu);font-weight:400}
.list-empty{color:var(--mu);font-size:14px;margin:8px 0 0}

.section-h{font-size:13px;color:var(--mu);font-weight:600;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-tab="home"><b>🏠</b>Главная</button>
  <button data-tab="market"><b>🛍</b>Маркет</button>
  <button data-tab="support"><b>💬</b>Поддержка</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S = { user:{}, profile:null, prices:{}, cur:'₽', number:null };
let tab = 'home', mk = 'coin', region = '+7', timer = null, locked = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Authorization': 'tma ' + tg.initData, 'Content-Type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || 'Ошибка'), j);
  return j;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1600); }
function copy(t) {
  const done = () => { toast('Скопировано'); tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => fallback(t, done)); else fallback(t, done);
}
function fallback(t, done) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) {} a.remove(); }
const price = k => (S.prices[k] ?? '—') + ' ' + S.cur;

function prem(plan, until) {
  if (!plan) return 'нет';
  if (!until) return String(plan);
  const d = new Date(until);
  if (isNaN(d)) return String(plan);
  const days = Math.ceil((d - Date.now()) / 86400000);
  return days < 0 ? 'истёк' : days + ' дн.';
}

/* ---------- экраны ---------- */
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  clearInterval(timer);
  const v = $('#view');

  if (locked) {
    v.innerHTML = `<div class="card"><h2>Подпишитесь на канал</h2><p class="mu">Без подписки мини-приложение недоступно.</p><button class="btn" onclick="tg.openTelegramLink(locked)">Подписаться</button><div style="height:8px"></div><button class="btn alt" onclick="boot()">Я подписался</button></div>`;
    return;
  }

  if (tab === 'home') {
    homeScreen(v);
  } else if (tab === 'support') {
    v.innerHTML = `<h2>Поддержка</h2><div class="card soon">Скоро</div>`;
  } else {
    const tabs = [['coin','Cat Coin'],['number','Номер'],['username','NFT-username'],['premium','Orenix Premium'],['verify','Верификация']];
    v.innerHTML = `<div class="chips">${tabs.map(t => `<button class="chip ${mk === t[0] ? 'on' : ''}" onclick="mk='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div id="pane"></div>`;
    pane();
  }
}

/* ---------- главная ---------- */
function homeScreen(v) {
  const u = S.user, p = S.profile;
  const uname = u.first_name || u.username || 'друг';
  const initial = String(uname)[0].toUpperCase();
  const hasProfile = p && ((p.numbers && p.numbers.length) || p.cat_coin || p.premium_plan);

  const hero = `
    <div class="hero">
      <div class="hero-top">
        <div class="ava">${esc(initial)}</div>
        <div>
          <div class="hero-greet">Добро пожаловать</div>
          <div class="hero-name">${esc((p && p.name) || uname)}</div>
        </div>
      </div>
      ${u.username ? `<div class="hero-tag">@${esc(u.username)}</div>` : ''}
    </div>`;

  if (!hasProfile) {
    v.innerHTML = hero + `
      <div class="qa">
        <button onclick="tab='market';mk='number';render()">
          <span class="ico">📱</span>
          <span class="lbl">Получить номер</span>
          <span class="sub">для регистрации</span>
        </button>
        <button onclick="tab='market';mk='coin';render()">
          <span class="ico">🐾</span>
          <span class="lbl">Cat Coin</span>
          <span class="sub">скоро в продаже</span>
        </button>
        <button onclick="tab='market';mk='premium';render()">
          <span class="ico">⭐</span>
          <span class="lbl">Premium</span>
          <span class="sub">подписка Orenix</span>
        </button>
        <button onclick="tab='support';render()">
          <span class="ico">💬</span>
          <span class="lbl">Поддержка</span>
          <span class="sub">мы на связи</span>
        </button>
      </div>
      <div class="card">
        <div class="section-h">С чего начать</div>
        <p class="mu" style="margin-top:8px">
          Перейдите в «Маркет» → «Номер», выберите регион и получите свой первый номер Orenix.
        </p>
      </div>`;
    return;
  }

  const nums = p.numbers || [];
  const uns = p.usernames || [];

  v.innerHTML = hero + `
    <div class="stats">
      <div class="stat">
        <div class="k">🐾 Cat Coin</div>
        <div class="v">${esc(p.cat_coin ?? 0)}</div>
      </div>
      <div class="stat">
        <div class="k">⭐ Premium</div>
        <div class="v ${p.premium_plan ? '' : 'sm'}">${esc(prem(p.premium_plan, p.premium_until))}</div>
      </div>
    </div>

    <div class="qa">
      <button onclick="tab='market';mk='number';render()">
        <span class="ico">📱</span>
        <span class="lbl">Номер</span>
        <span class="sub">${nums.length ? nums.length + ' шт.' : 'получить'}</span>
      </button>
      <button onclick="tab='market';mk='coin';render()">
        <span class="ico">🐾</span>
        <span class="lbl">Маркет</span>
        <span class="sub">Cat Coin · Premium</span>
      </button>
    </div>

    <div class="card">
      <div class="section-h">📱 Номера</div>
      ${nums.length
        ? nums.map(n => `<div class="list-row" onclick="copy('${esc(n)}')"><span>${esc(n)}</span><span class="cp">копировать</span></div>`).join('')
        : '<p class="list-empty">Пока нет номеров</p>'}
    </div>

    <div class="card">
      <div class="section-h">🆔 Юзернеймы</div>
      ${uns.length
        ? uns.map(x => {
            const u2 = String(x).replace(/^@/,'');
            return `<div class="list-row" onclick="copy('@${esc(u2)}')"><span>@${esc(u2)}</span><span class="cp">копировать</span></div>`;
          }).join('')
        : '<p class="list-empty">Пока нет юзернеймов</p>'}
    </div>`;
}

/* ---------- маркет ---------- */
function pane() {
  const p = $('#pane');
  if (mk === 'coin') {
    p.innerHTML = `<div class="grid2">${[['cc50','50 CC'],['cc100','100 CC']].map(c => `<div class="card"><div style="font-size:22px;font-weight:700">${c[1]}</div><div class="price">${price(c[0])}</div><button class="btn" disabled>Скоро в продаже</button></div>`).join('')}</div>`;
  } else if (mk === 'number') {
    numberPane();
  } else {
    p.innerHTML = `<div class="card soon">Скоро</div>`;
  }
}

/* ---------- номер ---------- */
function numberPane() {
  const n = S.number, p = $('#pane');
  if (!n) {
    p.innerHTML = `<div class="card"><h2 style="margin-top:0">Номер для Orenix</h2><p class="mu">Номер нужен для регистрации в мессенджере.</p>
      <button class="btn" onclick="openPay()">Рандом</button><div style="height:8px"></div>
      <button class="btn alt" onclick="toast('Скоро')">Ввести самому · скоро</button></div>`;
    return;
  }
  p.innerHTML = `<div class="card"><div class="mu">Ваш номер. Тап — скопировать</div>
    <div class="num"><button onclick="copy('${n.region.slice(1)}')">${esc(n.region)}</button><button onclick="copy('${esc(n.body)}')">${esc(n.body)}</button></div>
    <p class="mu" style="margin:0">На сайте выберите код региона и введите номер без пробелов.</p></div>
    ${n.code ? `<div class="card"><div class="mu">Ваш код. Тап — скопировать</div><div class="num"><button onclick="copy('${esc(n.code)}')">${esc(n.code)}</button></div></div>`
      : `<button class="btn" id="getcode" ${n.entered ? '' : 'disabled'} onclick="getCode()">Получить код</button>
         ${n.entered ? '' : '<p class="mu" style="margin-top:8px">Кнопка заработает, когда вы введёте номер на сайте.</p>'}`}`;
  if (!n.code) timer = setInterval(poll, 3000);
}
async function poll() {
  try {
    const n = (await api('/api/number')).number;
    if (n && S.number && (n.entered !== S.number.entered || n.code !== S.number.code)) {
      S.number = n;
      if (tab === 'market' && mk === 'number') numberPane();
    }
  } catch (e) {}
}
async function getCode() {
  const b = $('#getcode'); b.disabled = true;
  try { S.number = (await api('/api/number/code', { method: 'POST' })).number; numberPane(); }
  catch (e) { toast(e.message); b.disabled = false; }
}

/* ---------- оплата номера ---------- */
function openPay() {
  $('#panel').innerHTML = `<h2 style="margin-top:0">Случайный номер</h2>
    <div class="mu" style="margin-bottom:6px">Код региона</div>
    <div class="seg"><button class="${region === '+7' ? 'on' : ''}" onclick="region='+7';openPay()">+7</button><button class="${region === '+1' ? 'on' : ''}" onclick="region='+1';openPay()">+1</button></div>
    <div class="row" style="justify-content:space-between"><span class="mu">К оплате</span><span class="price" style="margin:0">${price('number')}</span></div>
    <div style="height:12px"></div><button class="btn" id="paybtn" onclick="pay()">Оплатить</button>
    <div style="height:8px"></div><button class="btn alt" onclick="closePay()">Отмена</button>`;
  $('#sheet').hidden = false;
}
function closePay() { $('#sheet').hidden = true; }
async function pay() {
  // ← ОПЛАТА: сейчас номер выдаётся сразу. Когда появится оплата, здесь сначала проведите платёж
  //   (например, Telegram Stars: openInvoice), и только после успеха вызывайте /api/number/random.
  const b = $('#paybtn'); b.disabled = true;
  try {
    S.number = (await api('/api/number/random', { method: 'POST', body: JSON.stringify({ region }) })).number;
    closePay(); render();
  } catch (e) { toast(e.message); b.disabled = false; }
}

/* ---------- запуск ---------- */
async function boot() {
  try { S = { ...S, ...(await api('/api/state')) }; locked = null; }
  catch (e) {
    if (e.error === 'not_subscribed') locked = e.channel_url;
    else { $('#view').innerHTML = `<div class="card soon">${esc(e.message)}<br>Откройте мини-приложение через бота.</div>`; return; }
  }
  render();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
boot();
</script>
</body>
</html>
